version: '3.4'

services:
  postgres:
    image: postgres:15
    container_name: ip_db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ghcr.io/charefahmed/insightpulse-backend:latest
    container_name: ip_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GROQ_API_KEY: ${GROQ_API_KEY}
    env_file:
      - .env
    depends_on:
      - postgres
    command: sh -c "npx prisma generate && npx prisma db push && npm run start:dev"

  frontend:
    image: ghcr.io/charefahmed/insightpulse-frontend:latest
    container_name: ip_frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    depends_on:
      - backend



volumes:
  pgdata:
