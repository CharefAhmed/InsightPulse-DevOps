apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: insightpulse-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: insightpulse.application
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{job="insightpulse-backend", status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{job="insightpulse-backend"}[2m])) > 0.05
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "InsightPulse — High error rate (> 5%)"
            description: "{{ $value | humanizePercentage }} of requests are returning 5xx errors."

        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{job="insightpulse-backend"}[2m])) by (le)
            ) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "InsightPulse — P95 latency above 2s"
            description: "95th percentile response time is {{ $value | humanizeDuration }}."

        - alert: BackendNoTraffic
          expr: |
            sum(rate(http_requests_total{job="insightpulse-backend"}[2m])) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "InsightPulse — Backend receiving no traffic"
            description: "No HTTP requests have been recorded in the last 2 minutes."

    - name: insightpulse.infrastructure
      rules:
        # Scenario: OOMKilled, liveness probe failing, bad startup command.
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace="{{ .Values.namespace }}"
            }[15m]) * 60 * 15 > 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} has restarted more than once in 15 minutes."

        # Scenario: ImagePullBackOff, Pending (not enough resources), OOMKilled.
        - alert: PodNotRunning
          expr: |
            kube_pod_status_phase{
              namespace="{{ .Values.namespace }}",
              phase!="Running",
              phase!="Succeeded"
            } == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is {{ $labels.phase }}"
            description: "Pod has been in {{ $labels.phase }} state for more than 2 minutes."

        - alert: HighMemoryUsage
          expr: |
            container_memory_working_set_bytes{
              namespace="{{ .Values.namespace }}",
              container="backend"
            } > 429496320
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "InsightPulse backend memory above 80% of limit"
            description: "Backend is using {{ $value | humanize1024 }}B — above the 410Mi warning threshold."

        # Scenario: Rolling update stuck, pod evicted, image pull failed.
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ .Values.namespace }}"}
            <
            kube_deployment_status_replicas_desired{namespace="{{ .Values.namespace }}"}
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} has fewer replicas than desired"
            description: "{{ $labels.deployment }} has {{ $value }} available replicas but more were requested."
