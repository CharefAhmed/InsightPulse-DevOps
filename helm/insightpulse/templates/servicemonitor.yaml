apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: insightpulse-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - { { .Values.namespace } }
  selector:
    matchLabels:
      app: insightpulse-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
