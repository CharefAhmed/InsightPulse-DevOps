apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "insightpulse.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | quote }}
  JWT_EXPIRES_IN: {{ .Values.backend.env.JWT_EXPIRES_IN | quote }}
  REFRESH_JWT_EXPIRES_IN: {{ .Values.backend.env.REFRESH_JWT_EXPIRES_IN | quote }}
  PORT: {{ .Values.backend.port | quote }}
