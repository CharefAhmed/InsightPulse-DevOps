namespace: insightpulse-production

backend:
  replicas: 2
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "800m"
      memory: "768Mi"
  env:
    NODE_ENV: production

frontend:
  replicas: 2
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "128Mi"

hpa:
  enabled: true
  backend:
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 60 # scale earlier in production
  frontend:
    minReplicas: 2
    maxReplicas: 3
    cpuUtilization: 70
