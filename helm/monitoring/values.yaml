# values.yaml — kube-prometheus-stack configuration

# -- Prometheus --
prometheus:
  prometheusSpec:
    scrapeInterval: "15s"
    evaluationInterval: "15s"
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    retention: 3d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# -- Grafana --
grafana:
  # adminPassword is injected at deploy time via --set (GitHub secret)
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  persistence:
    enabled: true
    size: 1Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  # Pre-built community dashboards loaded at startup
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      # Node.js / NestJS application metrics (heap, CPU, event loop, HTTP)
      nodejs-app:
        gnetId: 11159
        revision: 1
        datasource: Prometheus
      # Kubernetes cluster overview (pod CPU/RAM, restarts)
      k8s-cluster:
        gnetId: 15661
        revision: 1
        datasource: Prometheus
      # kube-state-metrics (pod status, deployments, HPA)
      kube-state:
        gnetId: 13332
        revision: 1
        datasource: Prometheus

# -- Alertmanager --
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  config:
    global:
      resolve_timeout: 5m
      # SLACK_WEBHOOK_URL is injected at deploy time via sed in deploy.yml
      slack_api_url: "SLACK_WEBHOOK_URL_PLACEHOLDER"

    route:
      receiver: slack-notifications
      group_by: [alertname, namespace, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
        - matchers:
            - severity = critical
          receiver: slack-notifications
          group_wait: 10s
          repeat_interval: 30m

    receivers:
      - name: slack-notifications
        slack_configs:
          - channel: "#insightpulse-alerts"
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} {{ .GroupLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Namespace:* {{ .Labels.namespace }}
              *Since:* {{ .StartsAt | since }}
              {{ end }}

    inhibit_rules:
      # If BackendNoTraffic fires (critical), suppress HighErrorRate (it's a consequence, not a separate issue)
      - source_matchers:
          - alertname = BackendNoTraffic
        target_matchers:
          - alertname = HighErrorRate
        equal: [namespace]

# -- kube-state-metrics --
kube-state-metrics:
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "96Mi"

# -- node-exporter --
# Collects OS-level metrics (CPU, RAM, disk) from the node.
prometheus-node-exporter:
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
