name: CI – Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1 : Paths Filter
  # Détermine quels composants ont été modifiés dans la PR
  # ─────────────────────────────────────────────────────────
  filter:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # ─────────────────────────────────────────────────────────
  # JOB 2 : Matrix CI
  # S'exécute dynamiquement uniquement pour les composants
  # qui ont des changements, détectés par le job "filter"
  # ─────────────────────────────────────────────────────────
  ci:
    name: 🧪 ${{ matrix.component.name }} – Lint & Test
    needs: filter
    runs-on: ubuntu-latest

    # La stratégie matrix est construite dynamiquement.
    # Chaque composant n'est inclus que si le filtre le détecte comme modifié.
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: Backend
            path: backend
            changed: ${{ needs.filter.outputs.backend }}
            node-version: '20.x'
            lint-cmd: npm run lint
            test-cmd: npm test -- --passWithNoTests

          - name: Frontend
            path: frontend/react_app
            changed: ${{ needs.filter.outputs.frontend }}
            node-version: '20.x'
            lint-cmd: npx eslint "src/**/*.{js,jsx}"
            test-cmd: npm test -- --watchAll=false --passWithNoTests

    # Ce job est ignoré si le composant correspondant n'a pas changé
    if: >
      needs.filter.outputs.backend == 'true' ||
      needs.filter.outputs.frontend == 'true'

    steps:
      - name: Skip if no changes in ${{ matrix.component.name }}
        if: matrix.component.changed != 'true'
        run: echo "⏭️ No changes detected in ${{ matrix.component.name }}, skipping."

      - name: Checkout code
        if: matrix.component.changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.component.node-version }}
        if: matrix.component.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.component.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component.path }}/package-lock.json

      - name: Install dependencies
        if: matrix.component.changed == 'true'
        working-directory: ${{ matrix.component.path }}
        run: npm ci

      - name: Run Lint
        if: matrix.component.changed == 'true'
        working-directory: ${{ matrix.component.path }}
        run: ${{ matrix.component.lint-cmd }}

      - name: Run Tests
        if: matrix.component.changed == 'true'
        working-directory: ${{ matrix.component.path }}
        run: ${{ matrix.component.test-cmd }}
