name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # Release Please analyzes commits on "main" (which must
  # follow the Conventional Commits specification: feat:, fix:, etc.)
  # and automatically manages:
  # - Creating / updating a Release PR
  # - Updating version numbers in package.json
  # - Generating the CHANGELOG.md file
  # - Creating a GitHub Tag (e.g., v1.2.0) upon merging
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.MY_PAT_TOKEN }}
          release-type: node
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
