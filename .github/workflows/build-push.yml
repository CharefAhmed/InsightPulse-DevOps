name: Build & Push Docker Images

on:
  # Se déclenche uniquement lorsqu'une Release est publiée
  # (c'est-à-dire quand Release Please crée un nouveau Tag)
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  # Nom du dépôt en minuscules, requis par ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Build & Push – Matrix sur les deux services
  # Chaque entrée de la matrix correspond à une image Docker
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push – ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Backend
            image-name: insightpulse-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - name: Frontend
            image-name: insightpulse-frontend
            context: ./frontend/react_app
            dockerfile: ./frontend/react_app/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extrait les métadonnées (tags, labels) pour l'image Docker.
      # Génère automatiquement les tags : latest + numéro de version du tag Git
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Authentification auprès de GitHub Container Registry
      # Utilise GITHUB_TOKEN, aucun secret supplémentaire requis
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Active BuildKit pour des builds plus rapides et le cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.service.context }}
          file:       ${{ matrix.service.dockerfile }}
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          # Cache entre les runs pour accélérer les builds
          cache-from: type=gha
          cache-to:   type=gha,mode=max
