name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push – ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: Backend
            image-name: insightpulse-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - name: Frontend
            image-name: insightpulse-frontend
            context: ./frontend/react_app
            dockerfile: ./frontend/react_app/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Scan (npm audit)
        working-directory: ${{ matrix.service.context }}
        run: npm audit --audit-level=critical

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image (local, no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image reference for Trivy
        id: image_ref
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "tag=$FIRST_TAG" >> $GITHUB_OUTPUT
      - name: Trivy – Security Gate (CRITICAL, blocks push)
        id: trivy_gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image_ref.outputs.tag }}
          format: table
          output: trivy-report-${{ matrix.service.image-name }}.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push ${{ matrix.service.name }} image to GHCR
        if: success()
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            docker push "$tag"
          done

      - name: Trivy – Full Report (CRITICAL + HIGH, for artifact)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ steps.image_ref.outputs.tag }}
          format: sarif
          output: trivy-report-${{ matrix.service.image-name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy table report – ${{ matrix.service.name }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ matrix.service.image-name }}
          path: trivy-report-${{ matrix.service.image-name }}.txt
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab – ${{ matrix.service.name }}
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-report-${{ matrix.service.image-name }}.sarif
          category: trivy-${{ matrix.service.image-name }}
