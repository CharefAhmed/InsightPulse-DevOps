---
- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install_k3s.sh
    mode: "0700"
  when: not k3s_binary.stat.exists

- name: Install K3s
  ansible.builtin.command: /tmp/install_k3s.sh --write-kubeconfig-mode=644 --disable=servicelb
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_binary.stat.exists
  # --disable=servicelb: we use Traefik as the single entry point, no need for the default LB

- name: Ensure K3s service is started and enabled
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for K3s node to become Ready
  ansible.builtin.command: kubectl get nodes
  register: k3s_nodes
  retries: 15
  delay: 10
  until: "'Ready' in k3s_nodes.stdout"
  changed_when: false

- name: Create .kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Copy kubeconfig for ubuntu user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"
